name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project and add app files
        run: |
          flutter create --platforms=android --project-name bd_calorie_tracker --org com.bdcalorie.tracker _gen
          cp -r lib _gen/
          cp pubspec.yaml _gen/
          cp -r assets _gen/
          sed -i 's/android:label="[^"]*"/android:label="Calorie Tracker"/' _gen/android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: _gen
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: calorie-tracker-apk
          path: _gen/build/app/outputs/flutter-apk/app-release.apk
